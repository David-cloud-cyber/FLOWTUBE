name: Deploy Supabase edge function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: fuvrxobxjcqyevsjsdfd
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: |
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            supabase db push --include-all
          else
            python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error

          project_ref = os.environ["PROJECT_REF"]
          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          if not token:
              message = "SUPABASE_ACCESS_TOKEN is missing and SUPABASE_DB_PASSWORD is not configured."
              print(f"::error::{message}", file=sys.stderr)
              with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as summary:
                  summary.write("### Supabase deployment diagnostic\n\n" + message + "\n")
              raise SystemExit(1)
          migration_names = [
              "20260813100000_add_provider_agnostic_generation_jobs.sql",
              "20260816100000_atomic_agent_and_generation_credits.sql",
              "20260817120000_huggyflow_launch_pricing_and_fapshi.sql",
              "20260817150000_huggyflow_pricing_quotas_and_credit_topups.sql",
          ]
          endpoint = f"https://api.supabase.com/v1/projects/{project_ref}/database/query"
          for name in migration_names:
              query = open("supabase/migrations/" + name, encoding="utf-8").read()
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({"query": query}).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      if response.status >= 300:
                          raise RuntimeError(f"migration request failed: {response.status}")
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")[:1200]
                  detail = re.sub(r"(?i)(bearer\s+)[^\s]+", r"\1[redacted]", detail)
                  message = f"migration {name} failed with HTTP {error.code}: {detail}"
                  print(f"::error::{message}", file=sys.stderr)
                  with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as summary:
                      summary.write("### Supabase migration diagnostic\n\n```text\n" + message + "\n```\n")
                  raise SystemExit(1) from error
              print(f"Applied {name}.")
          PY
          fi

      - name: Deploy flowtube-api
        run: supabase functions deploy flowtube-api --project-ref "$PROJECT_REF"
